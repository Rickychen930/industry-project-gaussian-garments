# Project metadata and tool settings. The code is run from the repository
# root (`python -m tryon.app`, `python -m tools.evaluate.<tool>`); it is not
# installed as a package. Dependencies: requirements.txt (setup.sh).
[project]
name = "gaussian-garments-tryon"
version = "1.0.0"
description = "Live 3D virtual try-on: Gaussian Garments on an SMPL-X body from a webcam, on an Apple M1"
requires-python = ">=3.10"

# The lint the CI runs (.github/workflows/checks.yml). Kept here so a plain
# `ruff check` gives the same answer locally as in CI, whatever ruff
# configuration sits in a parent directory.
[tool.ruff]
line-length = 160
extend-exclude = ["models", "data", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
