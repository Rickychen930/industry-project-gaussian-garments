name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt ruff
      - run: ruff check doctor.py tryon tools tests
      - run: bash -n live-tryon setup.sh
      # The SMPL-X body models are not redistributable, so tests that need
      # them skip here and run locally. Everything else must pass.
      - run: python -m unittest discover -s tests -v
